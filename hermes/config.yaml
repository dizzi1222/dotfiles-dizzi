_config_version: 53
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
  malloc_arena_max: 4
attachments:
  storage: hermes-home
plugins:
  clone_timeout_seconds: 300
  enabled:
  - agent-importers
  disabled: []
model:
  default: gpt-6-luna
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  aliases:
    nemotron: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
kanban:
  review_dispatch: true
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  process_wait_auto_notify: true
  client_env_passthrough: []
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  cloud_provider: local
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: null
  protect_first_n: 3
  idle_compact_after_seconds: 0
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  prefetch_spill_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
max_concurrent_sessions: null
group_sessions_per_user: true
hosted_rooms:
  discussion:
    max_rounds: 3
    max_messages: 10
streaming:
  enabled: false
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 150
  reasoning_effort: max
  service_tier: ''
  fast_auto_seconds: 60
  daybreak: false
  personalities: {}
gateway:
  unmanaged_idle_exit_seconds: 600
  signal_interrupt_grace_timeout: 1
  service_install_choice: install
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  sessiondb_loop_guard: 'off'
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
    max_hops: 4
    bot_replies_expect_reply: false
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: true
  auto_multiplex_migration: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
    history_tool_output_max_chars: 0
platform_toolsets:
  cli:
  - a2a
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - file
  - image_gen
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  telegram:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - cronjob
  - delegation
  - file
  - image_gen
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  qqbot:
  - hermes-qqbot
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
    timeout: 60
    max_retries: 1
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
  reasoning_effort: max
  max_concurrent_children: 5
display:
  compact: false
  cleanup_progress: false
  suppress_warning_notifications: false
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  streaming: true
  skin: default
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
updates:
  check: true
  backup_keep: 5
  non_interactive_local_changes: stash
approvals:
  destructive_slash_confirm: false
sessions:
  auto_prune: true
onboarding:
  seen:
    busy_input_prompt: true
mcp_servers:
  engram:
    command: "/home/diego/.local/bin/engram"
    args: ["mcp", "--tools=agent"]
    enabled: true
  n8n:
    command: "/home/diego/.local/bin/n8n-mcp-wrapper"
    enabled: true
  shopify:
    command: "/home/diego/.local/bin/shopify-mcp"
    enabled: true
  webshare:
    command: "/home/diego/.local/bin/webshare-proxy-wrapper"
    args: ["--show-url", "--country", "us", "--rotate"]
    env:
      PATH: "/home/diego/.local/bin:/home/diego/.linuxbrew/bin:/home/diego/.npm-global/bin:/usr/local/bin:/usr/bin:/bin"
    enabled: true
  node_repl:
    command: "/home/diego/.local/opt/chatgpt/resources/cua_node/bin/node_repl"
    env:
      NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS: '1000'
      NODE_REPL_NODE_MODULE_DIRS: "/home/diego/.local/opt/chatgpt/resources/cua_node/lib/node_modules"
      NODE_REPL_NODE_PATH: "/home/diego/.local/opt/chatgpt/resources/cua_node/bin/node"
      NODE_REPL_TRUSTED_CODE_PATHS: "/home/diego/.codex:/home/diego/.local/opt/chatgpt/resources/cua_node/lib/node_modules"
      CODEX_HOME: "/home/diego/.codex"
      BROWSER_USE_AVAILABLE_BACKENDS: chrome,iab,mcpapps
      BROWSER_USE_TINYSKY_ENABLED: '1'
      NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER: Control the in-app browser in conjunction with the Browser Plugin.
      NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME: Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this
        method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative.
      BROWSER_USE_CODEX_APP_BUILD_FLAVOR: prod
      BROWSER_USE_CODEX_APP_VERSION: 26.1029.61003
      NODE_REPL_TRUSTED_SERVICES: '{"browser":"/home/diego/.codex/plugins/cache/openai-bundled/browser/26.1029.61003/scripts/browser-service.mjs"}'
      CODEX_CLI_PATH: "/home/diego/.local/opt/chatgpt/resources/codex"
  cua_repl:
    command: "/home/diego/.local/opt/chatgpt/ChatGPT"
  rentahuman:
    url: https://rentahuman.ai/api/mcp
    headers:
      X-API-Key: "***"
    enabled: true
web:
  backend: exa
  provider_tier:
    exa: free
computer_use:
  backend: cua
image_gen:
  provider: openai-codex
  model: gpt-image-2-high
known_plugin_toolsets:
  cli:
  - a2a
  telegram:
  - a2a
known_builtin_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  telegram:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
_left_core_installed:
- agent-importers
fallback_providers:
- provider: openrouter
  model: nvidia/nemotron-3-ultra-550b-a55b:free
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
