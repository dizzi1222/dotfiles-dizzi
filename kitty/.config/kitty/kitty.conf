$terminal = kitty #o pones ghostty god
# Kitty uso sin pywal, o fondo mas apagado | Ghostty con pywal full transparente
# Recuerda con: 
# Ctrl Tab tabeas, 
# ctrl+shift enter para dividir ventanas,
# y Ctrl ;ñ para cerrarlas
#
# Pywal: detecta fondo transparente 🗿🦥 
# --------------------------------|
# Habilitar control remoto para permitir comandos @
listen_on unix:/tmp/kitty

# ctrl+shift enter para dividir ventanas,
map shift+enter launch --location=split
# Navegar al split siguiente (en orden clockwise)
map ctrl+tab next_window
# Navegar al split anterior
map ctrl+shift+tab previous_window

# -- lo mejor es LO DE arriba 📌🗣️
# otras opciones de navegación entre splits ️✍️
# Enfocar ventana superior
map ctrl+shift+up neighboring_window up
# Enfocar ventana inferior  
map ctrl+shift+down neighboring_window down
# Enfocar ventana izquierda
map ctrl+shift+left neighboring_window left
# Enfocar ventana derecha
map ctrl+shift+right neighboring_window right
