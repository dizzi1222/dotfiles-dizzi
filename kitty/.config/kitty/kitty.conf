# === HABILITAR IMÁGENES EN KITTY ===
# Permitir protocolo gráfico para image.nvim y otros plugins
allow_remote_control yes
listen_on unix:/tmp/kitty

# Habilitar protocolo gráfico (IMPORTANTE para imágenes)
enable_audio_bell no

# Configuración específica para imágenes
detect_images yes
