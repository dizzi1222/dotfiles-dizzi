#
# Envía la señal SIGINT (interrumpir) solo si NO hay una selección activa.
# Si hay selección, la combinación de teclas es 'robada' por Ghostty para copiar.[no se que dijo deepsek aca '-']
pass_keys Ctrl+C if-selection-not-empty

# (Opcional pero recomendado) Define la acción de copiar con el atajo estándar Ctrl+Shift+C
# Mapea Ctrl+C para copiar SI no hay una selección activa
map ctrl+c copy_or_interrupt
# Mapea Ctrl+V para pegar desde el portapapeles
map ctrl+v paste_from_clipboard

# No funciona ctrl+tab para cambiar de pestaña
#map ctrl+tab next_tab

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3

#cerrar pantalla split
map ctrl+; close_window

# quitar  la advertencia al cerrar ventana
confirm_os_window_close 0
