# Kitty config — dizzi
# Atajos:
#   Ctrl+Shift+Enter  → dividir ventana
#   Ctrl+Tab          → siguiente split
#   Ctrl+Shift+Tab    → split anterior
#   Ctrl+;            → cerrar split

# Control remoto
listen_on unix:/tmp/kitty

# Navegación splits
map shift+enter launch --location=split
map ctrl+tab next_window
map ctrl+shift+tab previous_window
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right

# Fuente
font_family MesloLGS Nerd Font Mono
font_size 10
bold_font auto
italic_font auto
bold_italic_font auto

# Opacidad
background_opacity 0.8

# Cursor
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Ratón
# mouse_hide_while_typing yes  # deprecated en kitty 0.40+

# Keybindings
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+; close_window

confirm_os_window_close 0

# Colores Dracula
background #282A36
foreground #9083C7
cursor #BD93F9
cursor_text_color #282A36
selection_background #2d384a
selection_foreground #a393f5
color0 #101211
color1 #82a6b2
color2 #FFF1AA
color3 #F1FA8C
color4 #89B4FA
color5 #d48eb6
color6 #A6E3A1
color7 #b0bfbc
color8 #b0bfbc
color9 #FF6E6E
color10 #9083C7
color11 #A6E3A1
color12 #D6ACFF
color13 #c79fbb
color14 #DDBDFF
color15 #575555

# Imágenes / protocolo gráfico
allow_remote_control yes
# listen_on unix:/tmp/kitty  # ya definido arriba
enable_audio_bell no
# detect_images yes  # deprecated, ahora automático