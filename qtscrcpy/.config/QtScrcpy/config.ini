[common]
# Language: Auto | en_US | zh_CN
Language=Auto
# Window title
WindowTitle=QtScrcpy
# Path on the Android device where pushed files are stored (must end with /)
PushFilePath=/sdcard/
# Max fps (Android 10+ only)
MaxFps=0
# Render expired video frames (0 = lower latency)
RenderExpiredFrames=0
# Video decoding: -1 auto, 0 software, 1 dx hardware, 2 opengl hardware
UseDesktopOpenGL=-1
# Path of scrcpy-server pushed to the Android device
ServerPath=/data/local/tmp/scrcpy-server.jar
# Custom adb path (empty = adb bundled with the app)
AdbPath=
# Encoder options, "" = defaults (example: CodecOptions="profile=1,level=2")
CodecOptions=""
# Encoder name, must be an H.264 encoder, "" = default
CodecName=""
# Log level (verbose, debug, info, warn, error)
LogLevel=verbose
