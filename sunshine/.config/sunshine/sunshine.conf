# ── Sunshine ─────────────────────────────────────────────
# capture = kms (OBLIGATORIO en niri)
#   El backend por defecto (wlgrab) falla al importar los dmabuf de niri
#   (niri usa Smithay, NO es wlroots):
#     Error: [wayland] Frame capture failed   (>70% de los frames)
#     -> pantalla con lineas horizontales en Moonlight
#   Ver LizardByte/Sunshine#5258. El changelog de Sunshine lo confirma:
#   "kmsgrab ... now compiled by default to support Wayland capture on
#    non-wlroots-based compositors".
#   KMS lee el framebuffer del DRM directo (no pasa por EGL/dmabuf).
#   Requisito: CAP_SYS_ADMIN -> lo da el wrapper de home.nix (T4c).
capture = kms
nvenc_preset = 1
