[Service]
# Reparto al iniciar cage: teclado/touchpad pasan a la Arzopa solo si hay
# teclado/mouse externos para el juego (ver arzopa-seat.sh). '-' = si falla,
# Zen arranca igual y todo queda en la laptop.
ExecStartPre=-/usr/bin/sudo -n /usr/local/bin/arzopa-attach
# Si cage/Zen se cierra, teclado y touchpad vuelven a la laptop; card0 se
# queda en seat-arzopa para poder relanzar Zen sin reiniciar Game Mode.
ExecStopPost=-/usr/bin/sudo -n /usr/local/bin/arzopa-detach --inputs
