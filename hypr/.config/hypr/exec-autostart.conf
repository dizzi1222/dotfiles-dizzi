# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal

# ‼️ [PATCHED] Auto-mover Spotify al workspace special:music [YA que no FUNCIONA windowsrulev2 special:music]
exec-once = ~/.config/hypr/scripts/music-apps-to-special-workspace.sh
# 🗿 LO DESACTIVE AUNQUE FUNCIONA, PORQUE YA REPARE WINDOWSRULE V3!!! 🗿

# OPTIMIZE POWER
exec-once = powerprofilesctl set balanced

#ESCRITORIO TIPO WINDOWS xp, 10, 11, vista 8.1 - Desktop
exec-once = vicinae server # para volverlo app main de archivos
exec-once = xdg-mime default nemo.desktop inode/directory application/x-desktop # para volverlo app main de archivos
##################
# ARRANCAR NEMO  #
##################
exec-once = [workspace special:magic] nemo-desktop
exec-once = bash -c "sleep 5 && hyprctl dispatch togglefloating" # Si no quieres que se muestre el desktop NEMO al arrancar [Hide Nemo].
exec-once = bash -c "sleep 7 && hyprctl dispatch workspace 1" # Si no quieres que se muestre el desktop NEMO al arrancar [Hide Nemo].
##################
# ARRANCAR NEMO  #
#################
# exec-once = [workspace 4] gnome-system-monitor # lo tendria abajo pero lo puse aca por boot sequence
exec-once = espanso
rxec-once = sleep 5 && espanso service start
# PANEL DE NOTIS, EN CONFLICTO CON dunstrc
exec-once = swaync
exec-once = swaync-client --dnd-off

#ESCRITORIO TIPO LINUX hypr [comenta lo de arriba si no quieres eso xd]

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet & volctl & greenclip daemon & blueman-applet
# exec-once = dunst -config ~/.config/dunstrc
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swww-daemon  #entra en conflicto con hypraper 🚨SI SOPORTA GIF!

# Configuración para el zoom literal, como el de los gestos.
# Requiere que hyprzoom esté activado en tu compilación.
exec-once = hyprctl setprop float:hyprzoom:zoom 1

# ${ MODIFICADO POR DIEGO}
exec-once = sh ~/.config/hypr/scripts/text_animation/anitext.sh
exec-once = sh ~/.config/hypr/scripts/weather/weather.sh

# exec-once = copyq
exec-once = sh ~/.config/hypr/scripts/toggle_copyq.sh
exec-once = sleep 3 && waybar # DE GIL en conflicto con la BAR de mi hermano

# otra forma de arrancr drive, stow gOD
exec-once = /home/diego/montar_gdrive.sh
exec-once = /home/diego/montar_gd-musica.sh

# Cambiar el cursorTheme DESDE ACA: 🚨...
exec-once = hyprctl setcursor Kafka 24
exec-once = xcursor-theme Kafka 24
# ACtivar Botones de MAC: /home/diego/mi_gdrive/- Linux Hyprland [Arch]/🔹♦️🔸Install-MAC-theme 🎨 .md
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout "close,minimize,maximize:"

