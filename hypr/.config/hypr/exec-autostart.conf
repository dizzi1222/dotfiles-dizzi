# INICIAR Workspaces por eww  #1

#otras configs de zenities # ${ MODIFICADO POR DIEGO}
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# ═══════════════════════════════════════════════════════════
# GNOME KEYRING (para Brave, Chrome, VSCode, etc)
# ═══════════════════════════════════════════════════════════
exec-once = dbus-update-activation-environment --all
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle

# # Para Compx 2.4G Wireless Receiver con preset "teclado-Bluetooth"
exec-once = input-remapper-control --command start --device "Compx 2.4G Wireless Receiver" --preset "teclado-Bluetooth"
# # Para AT Translated Set 2 keyboard con preset "teclado-classmate"
exec-once = input-remapper-control --command start --device "AT Translated Set 2 keyboard" --preset "teclado-classmate"
# # Para Logitetch G305 gaming mouse con preset "Mouse para ZURDOS kukardos"
exec-once = input-remapper-control --command start --device "Logitech G305" --preset "Mouse para ZURDOS kukardos"

# ═══════════════════════════════════════════════════════════
# 󰌌 🖱️I NICIAR keyboards de INPUT REMAPER EN UN SOLO SCRIPT ⌨️ 🚨
# ═══════════════════════════════════════════════════════════
exec-once = sh ~/scripts/setup-keyboard.sh # Configuracion de Input Remapper desactivar botones laterales de Logitech G305, teclado Bluetooth, Set 2 keyboard..
#otras configs de zenities # FIN ${ MODIFICADO POR DIEGO} FIN

# Configs DIZZI - Toggle Monitor Rotation (vertical ↔ horizontal)
# Detecta el compositor activo y aplica la rotación correcta con estado persistente.
exec-once = sleep 3 && sh /home/diego/scripts/toggle-monitor-rotation
