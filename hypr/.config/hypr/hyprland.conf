#   I use my personal config file for Hyprland, so I'll just use that one.
$cConf = ~/.config/caelestia
$qConf = ~/.config/quickshell
$hl = ~/.config/hypr
$cp = ~/.config/hypr/scripts
$scp = ~/scripts

# #######################################################################################
# Configs DIZZI
# #######################################################################################
source = $hl/envs.conf
source = $hl/programs-variables.conf
source = $hl/input.conf
source = $hl/windows.conf
source = $hl/exec-autostart.conf
source = $hl/monitors.conf
source = ~/.config/hypr/looknfeel.conf # dizzi animations, decoration, general etc
source = ~/.config/hypr/bindings.conf # dizzi bindings
source = $hl/keybinds-zenities.conf # some zenities bindings

# Mouse cursor flicker fix (hardware cursors cause glitches on some GPUs)
cursor:no_hardware_cursors = true
