set-option -sa terminal-overrides ",xterm*:RGB"
set -g mouse on

# ── Portapapeles / Clipboard ─────────────────────────────────────────────────
# OSC52: permite que apps dentro de tmux (opencode, agy, nvim) escriban al
# portapapeles del terminal/Android SIN necesitar Termux:API ni xclip.
# set-clipboard on  → tmux propaga las secuencias OSC52 hacia el terminal.
# allow-passthrough → imágenes y secuencias externas pasan sin filtro.
set -g set-clipboard on
set -g @override_copy_command 'termux-clipboard-set'

# set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# set reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# status bar at top
set-option -g status-position top

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Image
set -g allow-passthrough all

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'tinted-theming/tinted-tmux'
source-file ~/.cache/wal/colors-tmux.conf
# set -g @tinted-color 'base16-default-dark' # (the default)
# set -g @plugin 'dracula/tmux'
# set -s @plugin 'tmux-25color'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings — vi copy-mode con portapapeles Termux/OSC52
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y → copia al portapapeles Android vía termux-clipboard-set (con timeout
#     para evitar cuelgue si Termux:API app no está instalada)
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel \
  "timeout 3 termux-clipboard-set || true"
# MouseDrag: seleccionar con mouse y copiar automáticamente al soltar
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
  "timeout 3 termux-clipboard-set || true"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
